name: Android APK

on:
  push:
    tags: ['v*']
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes a running check; tag builds always finish.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from secrets"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "suffix=-test-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::GLIDE_KEYSTORE_BASE64 is not set; the APK is signed with the public CI test key (see ci/README.md)"
          fi

      - name: Test and build
        env:
          GLIDE_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          GLIDE_KEYSTORE_PASSWORD: ${{ secrets.GLIDE_KEYSTORE_PASSWORD }}
          GLIDE_KEY_ALIAS: ${{ secrets.GLIDE_KEY_ALIAS }}
          GLIDE_KEY_PASSWORD: ${{ secrets.GLIDE_KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon -PglideVersion="${{ steps.version.outputs.version }}" \
            -PglideVersionCode="$GITHUB_RUN_NUMBER" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
            "out/glide-phone-${{ steps.version.outputs.version }}${{ steps.key.outputs.suffix }}.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs out/*.apk
          ls -l out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An APK that builds can still die at start (shrunk-away classes did once);
      # launch the very file that is released on an emulator before releasing it.
      - name: Start the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh ci/smoke.sh out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Glide Phone $GITHUB_REF_NAME" \
              --notes "Android APK built from $GITHUB_REF_NAME." \
              $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: glide-phone-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            logcat.txt
